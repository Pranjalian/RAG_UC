name: Scheduled RAG Ingestion Pipeline

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allow manual triggering from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Railway API Ingestion
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RAILWAY_APP_URL: ${{ secrets.RAILWAY_APP_URL }}
        run: |
          if [ -z "$RAILWAY_APP_URL" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "Error: RAILWAY_APP_URL or ADMIN_TOKEN secrets are missing."
            exit 1
          fi
          
          echo "Triggering ingestion at $RAILWAY_APP_URL/api/ingest"
          
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RAILWAY_APP_URL/api/ingest" -H "Authorization: Bearer $ADMIN_TOKEN")
          
          http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d':' -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          
          echo "Response status: $http_status"
          echo "Response body: $body"
          
          if [ "$http_status" -ne 200 ]; then
            echo "Failed to trigger ingestion pipeline."
            exit 1
          fi
          
          echo "Ingestion triggered successfully! Check Railway logs for progress."
